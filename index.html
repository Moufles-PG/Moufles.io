<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>DACTYMOT</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         TITRE
         ========================================= -->

    <header>

        <h1>DACTYMOT</h1>

    </header>

    <div id="sous-titre">
    <span>5 lettres</span>
    <span>1 mot</span> </div>


    <!-- =========================================
         MESSAGES
         ========================================= -->

    <div id="message"></div>


    <!-- =========================================
         MUSIQUES
         ========================================= -->

    <audio
        id="musiqueJeu"
        loop
    >

        <source
            src="Wordle1.mp3"
            type="audio/mpeg"
        >

    </audio>


    <audio id="musiqueVictoire">

        <source
            src="Victory.mp3"
            type="audio/mpeg"
        >

    </audio>


    <audio id="musiqueDefaite">

        <source
            src="Fail.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =========================================
         JEU
         ========================================= -->

    <div class="jeu">


        <!-- =====================================
             ZONE DE LA GRILLE
             ===================================== -->

        <div class="zone-grille">


            <!-- FEUILLE -->

            <div class="feuille">


                <!-- CHARIOT -->

                <div id="chariot"></div>


                <!-- =============================
                     LIGNE 1
                     ============================= -->

                <div class="ligne">

                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>

                </div>


                <!-- =============================
                     LIGNE 2
                     ============================= -->

                <div class="ligne">

                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>

                </div>


                <!-- =============================
                     LIGNE 3
                     ============================= -->

                <div class="ligne">

                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>

                </div>


                <!-- =============================
                     LIGNE 4
                     ============================= -->

                <div class="ligne">

                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>

                </div>


                <!-- =============================
                     LIGNE 5
                     ============================= -->

                <div class="ligne">

                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>

                </div>


                <!-- =============================
                     LIGNE 6
                     ============================= -->

                <div class="ligne">

                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>
                    <div class="case"></div>

                </div>


            </div>

        </div>


        <!-- =====================================
             CLAVIER
             ===================================== -->

        <div id="clavier">


            <div class="ligne-clavier">

                <div class="touche">A</div>
                <div class="touche">Z</div>
                <div class="touche">E</div>
                <div class="touche">R</div>
                <div class="touche">T</div>
                <div class="touche">Y</div>
                <div class="touche">U</div>
                <div class="touche">I</div>
                <div class="touche">O</div>
                <div class="touche">P</div>

            </div>


            <div class="ligne-clavier">

                <div class="touche">Q</div>
                <div class="touche">S</div>
                <div class="touche">D</div>
                <div class="touche">F</div>
                <div class="touche">G</div>
                <div class="touche">H</div>
                <div class="touche">J</div>
                <div class="touche">K</div>
                <div class="touche">L</div>
                <div class="touche">M</div>

            </div>


            <div class="ligne-clavier">

                <div class="touche">W</div>
                <div class="touche">X</div>
                <div class="touche">C</div>
                <div class="touche">V</div>
                <div class="touche">B</div>
                <div class="touche">N</div>

            </div>


        </div>

    </div>


    <!-- =========================================
         ÉCRAN DE FIN
         ========================================= -->

    <div id="ecranFin">


        <div class="fin-contenu">

            <h2 id="titreFin"></h2>

            <p id="texteFin"></p>

            <div id="motFin"></div>

            <button id="boutonRejouer">
                REJOUER
            </button>

        </div>


    </div>


    <script src="script.js"></script>


</body>

</html>
